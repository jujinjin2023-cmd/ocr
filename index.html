<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能多格式文字与符号识别工具</title>
    
    <!-- UI 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 核心处理库 (纯前端) -->
    <!-- 1. OCR 引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- 2. PDF 渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- 3. Word 提取引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- 4. Excel 提取引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 5. LaTeX 渲染 (用于数学公式展示) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        .drop-zone {
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%234F46E5FF' stroke-width='2' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }
        .drop-zone.dragover { background-color: #EEF2FF; transform: scale(1.01); }
        .loader { border-top-color: #4F46E5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 10px 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">
                <i class="fa-solid fa-layer-group mr-2"></i>全能多格式识别工具
            </h1>
            <p class="text-gray-600 max-w-3xl mx-auto text-sm">
                支持 <span class="font-bold text-indigo-600">图片、PDF、Word、Excel</span>。纯前端处理，保护隐私。
                <br><span class="text-xs text-gray-500">(注：Word/Excel 为直接提取原生文本；图片/PDF 为 AI 视觉识别)</span>
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 左侧：控制面板 (占 4 列) -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- 识别模式选择 (动态显示) -->
                <div id="modePanel" class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-2">处理方式</label>
                    <select id="engineMode" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border text-sm mb-3">
                        <!-- 选项将由 JS 动态注入 -->
                    </select>
                    
                    <!-- MathPix 配置 (仅图片/PDF 且选择专业模式时显示) -->
                    <div id="mathpixConfig" class="hidden space-y-3 p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                        <p class="text-xs text-indigo-700 font-semibold">MathPix API (数理化公式精准识别)</p>
                        <input type="text" id="mathpixAppId" placeholder="App ID" class="w-full text-sm p-2 border rounded">
                        <input type="text" id="mathpixAppKey" placeholder="App Key" class="w-full text-sm p-2 border rounded">
                    </div>
                </div>

                <!-- 上传区域 -->
                <div id="dropZone" class="drop-zone bg-white rounded-xl p-8 text-center cursor-pointer hover:bg-indigo-50">
                    <input type="file" id="fileInput" class="hidden" accept=".png, .jpg, .jpeg, .webp, .pdf, .docx, .xlsx">
                    <i class="fa-solid fa-file-import text-4xl text-indigo-500 mb-3"></i>
                    <h3 class="text-lg font-semibold text-gray-700 mb-1">点击或拖拽文件到此处</h3>
                    <p class="text-xs text-gray-500">支持: JPG, PNG, PDF, DOCX, XLSX</p>
                </div>

                <!-- 文件信息预览 -->
                <div id="fileInfoContainer" class="hidden bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <div class="flex items-center space-x-3 mb-3">
                        <i id="fileIcon" class="fa-solid fa-file text-2xl text-gray-400"></i>
                        <div class="flex-1 min-w-0">
                            <p id="fileName" class="text-sm font-medium text-gray-900 truncate">filename.ext</p>
                            <p id="fileSize" class="text-xs text-gray-500">0 KB</p>
                        </div>
                    </div>
                    <button id="clearBtn" class="w-full text-red-500 hover:text-red-700 text-sm font-medium py-2 border border-red-200 rounded-lg hover:bg-red-50 transition">
                        <i class="fa-solid fa-trash mr-1"></i> 移除文件
                    </button>
                </div>

                <!-- 识别按钮 -->
                <button id="processBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-bolt mr-2"></i> <span id="processBtnText">开始处理</span>
                </button>

                <!-- 进度条 -->
                <div id="progressContainer" class="hidden bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <div class="flex justify-between text-xs text-gray-600 mb-1">
                        <span id="progressStatus">准备中...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果展示区 (占 8 列) -->
            <div class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full min-h-[600px]">
                <div class="flex justify-between items-center p-5 border-b border-gray-100">
                    <div class="flex space-x-4">
                        <button id="tabRaw" class="text-indigo-600 font-bold border-b-2 border-indigo-600 pb-1 text-sm">提取结果 (文本/LaTeX)</button>
                        <button id="tabRender" class="text-gray-500 hover:text-gray-700 font-medium pb-1 text-sm hidden">可视化渲染</button>
                    </div>
                    <button id="copyBtn" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium disabled:opacity-50" disabled>
                        <i class="fa-regular fa-copy mr-1"></i> 复制结果
                    </button>
                </div>
                
                <div class="flex-1 p-5 relative">
                    <textarea id="resultText" class="w-full h-full p-4 border border-gray-200 rounded-lg bg-gray-50 text-gray-800 font-mono text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="处理结果将显示在这里..." readonly></textarea>
                    <div id="renderView" class="hidden w-full h-full p-4 overflow-auto bg-gray-50 rounded-lg border border-gray-200 text-lg"></div>
                </div>

                <!-- 状态提示 -->
                <div id="statusBox" class="hidden m-5 p-3 rounded-lg text-sm flex items-start">
                    <i id="statusIcon" class="fa-solid fa-circle-info mt-0.5 mr-2"></i>
                    <span id="statusMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // DOM 元素
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfoContainer = document.getElementById('fileInfoContainer');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileIcon = document.getElementById('fileIcon');
        const modePanel = document.getElementById('modePanel');
        const engineMode = document.getElementById('engineMode');
        const mathpixConfig = document.getElementById('mathpixConfig');
        const processBtn = document.getElementById('processBtn');
        const processBtnText = document.getElementById('processBtnText');
        const clearBtn = document.getElementById('clearBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');
        const progressPercent = document.getElementById('progressPercent');
        const resultText = document.getElementById('resultText');
        const renderView = document.getElementById('renderView');
        const tabRaw = document.getElementById('tabRaw');
        const tabRender = document.getElementById('tabRender');
        const copyBtn = document.getElementById('copyBtn');
        const statusBox = document.getElementById('statusBox');
        const statusMessage = document.getElementById('statusMessage');
        const statusIcon = document.getElementById('statusIcon');

        let currentFile = null;
        let currentFileType = ''; // 'image', 'pdf', 'word', 'excel'
        let currentLatex = '';

        // 1. 拖拽与上传逻辑
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function handleFile(file) {
            currentFile = file;
            const ext = file.name.split('.').pop().toLowerCase();
            
            // 路由判断
            if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                currentFileType = 'image';
                fileIcon.className = 'fa-solid fa-image text-2xl text-blue-500';
                setupModePanel('image');
            } else if (ext === 'pdf') {
                currentFileType = 'pdf';
                fileIcon.className = 'fa-solid fa-file-pdf text-2xl text-red-500';
                setupModePanel('pdf');
            } else if (ext === 'docx') {
                currentFileType = 'word';
                fileIcon.className = 'fa-solid fa-file-word text-2xl text-blue-700';
                setupModePanel('word');
            } else if (ext === 'xlsx') {
                currentFileType = 'excel';
                fileIcon.className = 'fa-solid fa-file-excel text-2xl text-green-600';
                setupModePanel('excel');
            } else {
                alert('不支持的文件格式。请上传 JPG, PNG, PDF, DOCX 或 XLSX 文件。');
                return;
            }

            fileName.innerText = file.name;
            fileSize.innerText = formatBytes(file.size);
            fileInfoContainer.classList.remove('hidden');
            modePanel.classList.remove('hidden');
            processBtn.disabled = false;
            resetResult();
        }

        function setupModePanel(type) {
            engineMode.innerHTML = '';
            mathpixConfig.classList.add('hidden');
            tabRender.classList.add('hidden');

            if (type === 'image' || type === 'pdf') {
                const opt1 = document.createElement('option');
                opt1.value = 'tesseract';
                opt1.text = '🆓 通用 OCR 识别 (适合普通文字/简单符号)';
                engineMode.add(opt1);

                const opt2 = document.createElement('option');
                opt2.value = 'mathpix';
                opt2.text = '👑 专业公式识别 (MathPix API, 适合复杂数理化)';
                engineMode.add(opt2);

                if (type === 'pdf') {
                    showStatus('info', 'PDF 处理策略：将提取第一页渲染为高清图像，然后进行 OCR 识别。适合扫描版 PDF。');
                }
            } else if (type === 'word') {
                const opt = document.createElement('option');
                opt.value = 'extract';
                opt.text = '⚡ 直接提取原生文本 (无需 OCR, 100% 准确)';
                engineMode.add(opt);
                showStatus('info', 'Word 文档将直接解析内部 XML 提取纯文本，速度极快且不会丢失字符。');
            } else if (type === 'excel') {
                const opt = document.createElement('option');
                opt.value = 'extract';
                opt.text = '⚡ 直接解析表格数据 (转换为文本/CSV 格式)';
                engineMode.add(opt);
                showStatus('info', 'Excel 文件将直接读取单元格数据，并格式化为易读的文本列表。');
            }
        }

        engineMode.addEventListener('change', () => {
            if (engineMode.value === 'mathpix') {
                mathpixConfig.classList.remove('hidden');
            } else {
                mathpixConfig.classList.add('hidden');
            }
        });

        clearBtn.addEventListener('click', () => {
            currentFile = null;
            currentFileType = '';
            fileInput.value = '';
            fileInfoContainer.classList.add('hidden');
            modePanel.classList.add('hidden');
            processBtn.disabled = true;
            resetResult();
        });

        function resetResult() {
            resultText.value = '';
            currentLatex = '';
            renderView.innerHTML = '';
            copyBtn.disabled = true;
            statusBox.classList.add('hidden');
            progressContainer.classList.add('hidden');
        }

        function showStatus(type, msg) {
            statusBox.classList.remove('hidden', 'bg-blue-50', 'text-blue-800', 'bg-yellow-50', 'text-yellow-800', 'bg-green-50', 'text-green-800');
            statusIcon.className = 'mt-0.5 mr-2 fa-solid';
            
            if (type === 'info') {
                statusBox.classList.add('bg-blue-50', 'text-blue-800');
                statusIcon.classList.add('fa-circle-info');
            } else if (type === 'warning') {
                statusBox.classList.add('bg-yellow-50', 'text-yellow-800');
                statusIcon.classList.add('fa-triangle-exclamation');
            } else if (type === 'success') {
                statusBox.classList.add('bg-green-50', 'text-green-800');
                statusIcon.classList.add('fa-check-circle');
            }
            statusMessage.innerText = msg;
        }

        // 2. 核心处理路由
        processBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            processBtn.disabled = true;
            processBtnText.innerText = '处理中...';
            processBtn.innerHTML = '<div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 mr-2"></div> 处理中...';
            progressContainer.classList.remove('hidden');
            resultText.value = '正在处理文件，请稍候...';

            try {
                if (currentFileType === 'word') {
                    await processWord();
                } else if (currentFileType === 'excel') {
                    await processExcel();
                } else if (currentFileType === 'image') {
                    await processImage();
                } else if (currentFileType === 'pdf') {
                    await processPDF();
                }
            } catch (error) {
                console.error(error);
                resultText.value = `处理失败: ${error.message}`;
                showStatus('warning', '文件处理过程中发生错误，请检查文件格式是否损坏。');
            } finally {
                processBtn.disabled = false;
                processBtn.innerHTML = '<i class="fa-solid fa-bolt mr-2"></i> <span id="processBtnText">开始处理</span>';
            }
        });

        // --- 处理器 A: Word (.docx) ---
        async function processWord() {
            progressStatus.innerText = "正在解析 Word 文档结构...";
            progressBar.style.width = "50%";
            
            const arrayBuffer = await currentFile.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            
            progressBar.style.width = "100%";
            progressPercent.innerText = "100%";
            progressStatus.innerText = "提取完成";
            
            const text = result.value.trim();
            resultText.value = text || "文档中未找到可见文本。";
            copyBtn.disabled = false;
            showStatus('success', `Word 提取成功！共提取 ${text.length} 个字符。`);
        }

        // --- 处理器 B: Excel (.xlsx) ---
        async function processExcel() {
            progressStatus.innerText = "正在读取 Excel 数据...";
            progressBar.style.width = "50%";
            
            const arrayBuffer = await currentFile.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            
            let output = [];
            workbook.SheetNames.forEach(sheetName => {
                output.push(`\n--- 工作表: ${sheetName} ---\n`);
                const worksheet = workbook.Sheets[sheetName];
                // 转换为 JSON，保留空值以便对齐
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                
                json.forEach(row => {
                    // 过滤掉完全为空的行
                    if (row.some(cell => cell !== "")) {
                        output.push(row.join(" | ")); // 使用 | 分隔，模拟 CSV/表格观感
                    each
                });
            });
            
            progressBar.style.width = "100%";
            progressPercent.innerText = "100%";
            progressStatus.innerText = "解析完成";
            
            const finalText = output.join('\n').trim();
            resultText.value = finalText || "Excel 文件中未找到数据。";
            copyBtn.disabled = false;
            showStatus('success', 'Excel 解析成功！数据已格式化为文本视图。');
        }

        // --- 处理器 C: 图片 (Image) ---
        async function processImage() {
            if (engineMode.value === 'mathpix') {
                await processWithMathPix(currentFile);
            } else {
                await processWithTesseract(currentFile);
            }
        }

        // --- 处理器 D: PDF (.pdf) ---
        async function processPDF() {
            progressStatus.innerText = "正在加载 PDF 引擎...";
            progressBar.style.width = "20%";
            
            const arrayBuffer = await currentFile.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            progressStatus.innerText = `PDF 共 ${pdf.numPages} 页。正在渲染第 1 页为图像...`;
            progressBar.style.width = "40%";
            
            // 仅获取第一页进行 OCR (为了前端性能和演示)
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2.0 }); // 2倍缩放以提高 OCR 准确率
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            
            progressStatus.innerText = "图像渲染完成，正在启动识别引擎...";
            progressBar.style.width = "60%";
            
            // 将 Canvas 转为 File 对象，复用图片处理逻辑
            canvas.toBlob(async (blob) => {
                const imageFile = new File([blob], "pdf_page_1.png", { type: "image/png" });
                if (engineMode.value === 'mathpix') {
                    await processWithMathPix(imageFile);
                } else {
                    await processWithTesseract(imageFile);
                }
            }, 'image/png');
        }

        // --- 子引擎: Tesseract.js ---
        async function processWithTesseract(file) {
            try {
                const { data: { text, confidence } } = await Tesseract.recognize(
                    URL.createObjectURL(file),
                    'chi_sim+eng', 
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const pct = Math.round(m.progress * 100);
                                progressBar.style.width = `${pct}%`;
                                progressPercent.innerText = `${pct}%`;
                                progressStatus.innerText = `AI 正在识别文字与符号: ${pct}%`;
                            } else {
                                progressStatus.innerText = m.status;
                            }
                        }
                    }
                );
                
                currentLatex = text.trim(); // 这里实际是普通文本
                resultText.value = currentLatex || "未识别到任何内容。";
                copyBtn.disabled = false;
                
                if (confidence < 70) {
                    showStatus('warning', `识别完成，但置信度较低 (${Math.round(confidence)}%)。如果是复杂公式，建议切换为“专业公式识别”模式。`);
                } else {
                    showStatus('success', `识别成功！置信度: ${Math.round(confidence)}%`);
                }
            } catch (err) {
                throw new Error("Tesseract 识别失败: " + err.message);
            }
        }

        // --- 子引擎: MathPix API ---
        async function processWithMathPix(file) {
            const appId = document.getElementById('mathpixAppId').value.trim();
            const appKey = document.getElementById('mathpixAppKey').value.trim();

            if (!appId || !appKey) {
                throw new Error("使用专业模式必须填写 MathPix App ID 和 App Key");
            }

            progressStatus.innerText = "正在上传至专业识别引擎...";
            progressBar.style.width = "50%";

            const base64Data = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            progressStatus.innerText = "AI 正在解析复杂公式结构...";
            progressBar.style.width = "75%";

            const response = await fetch('https://api.mathpix.com/v3/text', {
                method: 'POST',
                headers: {
                    'app_id': appId,
                    'app_key': appKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    src: `data:image/jpeg;base64,${base64Data}`,
                    formats: ['text', 'latex_styled'],
                    data_options: { include_asciimath: true, include_latex: true }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || `API 请求失败: ${response.status}`);
            }

            const data = await response.json();
            currentLatex = data.latex_styled || data.text || "未识别到公式";
            
            progressBar.style.width = "100%";
            progressPercent.innerText = "100%";
            progressStatus.innerText = "识别完成！";

            resultText.value = currentLatex;
            copyBtn.disabled = false;
            tabRender.classList.remove('hidden');
            showStatus('success', '专业识别成功！已输出为 LaTeX 格式。可切换至“可视化渲染”查看排版效果。');
            renderLatex(currentLatex);
        }

        // 渲染 LaTeX
        function renderLatex(latex) {
            try {
                renderView.innerHTML = '';
                katex.render(latex, renderView, { throwOnError: false, displayMode: true });
            } catch (e) {
                renderView.innerHTML = `<p class="text-red-500 text-sm">渲染失败: ${e.message}</p><pre class="mt-2 text-xs">${latex}</pre>`;
            }
        }

        // 标签页切换
        tabRaw.addEventListener('click', () => {
            tabRaw.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600', 'font-bold');
            tabRaw.classList.remove('text-gray-500', 'font-medium');
            tabRender.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600', 'font-bold');
            tabRender.classList.add('text-gray-500', 'font-medium');
            resultText.classList.remove('hidden');
            renderView.classList.add('hidden');
        });

        tabRender.addEventListener('click', () => {
            tabRender.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600', 'font-bold');
            tabRender.classList.remove('text-gray-500', 'font-medium');
            tabRaw.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600', 'font-bold');
            tabRaw.classList.add('text-gray-500', 'font-medium');
            resultText.classList.add('hidden');
            renderView.classList.remove('hidden');
            if (currentLatex && engineMode.value === 'mathpix') {
                renderLatex(currentLatex);
            }
        });

        // 复制功能
        copyBtn.addEventListener('click', () => {
            resultText.select();
            document.execCommand('copy');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> 已复制';
            setTimeout(() => { copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> 复制结果'; }, 2000);
        });
    </script>
</body>
</html>
